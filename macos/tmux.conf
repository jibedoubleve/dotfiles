set -g mouse on

# Disable automatic renaming so your custom names stick
set -g automatic-rename off
set -g allow-rename off

# Index pane management
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Catppuccin window text options (set BEFORE running the plugin)
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# Run Catppuccin (AFTER setting the options above)
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

set -g pane-border-format "#{pane_index} #{pane_title}"
set -g pane-border-status bottom

# Handle colour support
set -g default-terminal "tmux-256color"
set -as terminal-features ",tmux-256color:RGB"
set -as terminal-overrides ",tmux-256color:RGB"
