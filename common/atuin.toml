# Atuin configuration, shared between macOS (zsh) and Windows (PowerShell).
# Every option is set explicitly so the behaviour does not depend on the
# platform defaults or on the atuin version.
# Reference: `atuin default-config`

## General
dialect = "uk"                      # dd/mm/yyyy dates
timezone = "local"
update_check = true
update_channel = "stable"

## Sync (only active once logged in with `atuin login`)
auto_sync = true
sync_address = "https://api.atuin.sh"
sync_frequency = "5m"
network_connect_timeout = 5
network_timeout = 30
local_timeout = 2

## Key bindings installed by `atuin init`
bind_ctrl_r = true
bind_up_arrow = true

## Search
search_mode = "fuzzy"
search_mode_shell_up_key_binding = "fuzzy"
filter_mode = "global"
filter_mode_shell_up_key_binding = "global"
workspaces = true

## UI
style = "compact"
inline_height = 40
inline_height_shell_up_key_binding = 0
invert = false
show_preview = true
max_preview_height = 4
show_help = true
show_tabs = true
show_whats_new = true
auto_hide_height = 8
show_numeric_shortcuts = true
ctrl_n_shortcuts = false
prefers_reduced_motion = false

## Editing behaviour
enter_accept = true                 # Enter runs the command, Tab puts it in the prompt
exit_mode = "return-original"
command_chaining = false
keymap_mode = "emacs"
word_jump_mode = "emacs"
word_chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"
scroll_context_lines = 1

## History recording
history_format = "{time}\t{command}\t{duration}"
strip_trailing_whitespace = true
store_failed = true
secrets_filter = true
history_filter = []
cwd_filter = []

[stats]
common_prefix = ["sudo"]
common_subcommands = [
  "cargo",
  "docker",
  "dotnet",
  "git",
  "npm",
  "podman",
  "tmux",
]
ignored_commands = []

[keys]
scroll_exits = true
exit_past_line_start = true
accept_past_line_end = true
accept_past_line_start = false
accept_with_backspace = false

[preview]
strategy = "auto"

[search]
filters = ["global", "host", "session", "workspace", "directory", "session-preload"]
shells = "auto"                     # only show commands from the current shell type

[theme]
name = "default"

# Unix-only features, disabled so macOS behaves like Windows
[daemon]
enabled = false
autostart = false

[pty_proxy]
enabled = false

[tmux]
enabled = false

[threads]
enabled = false
